name: Android integration tests
on:
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:
    inputs:
      longRecording:
        description: Run the 10-minute background and lock-screen recording test
        required: true
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim -camera-back none
          script: bash ci/android-integration.sh ${{ github.event_name == 'pull_request' || inputs.longRecording }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-integration-reports
          path: |
            app/build/reports/device/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/


